name: random_picker
description: 便携式随机抽人工具（Windows / Android），数据与程序同目录，零残留。
publish_to: 'none'

# 版本号请与 lib/core/constants.dart 里的 kAppVersion 保持一致
version: 1.0.2+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 检查 GitHub 更新
  http: ^1.2.2
  # 打开浏览器下载 / 打开数据目录
  url_launcher: ^6.3.0
  # 跨平台路径拼接
  path: ^1.9.0
  # 移动端数据目录（Windows 端不使用，保证便携）
  path_provider: ^2.1.4
  # 原生「打开文件」对话框
  file_selector: ^1.0.3
  # 调 Windows DWM API 给标题栏上色（只用到 toNativeUtf16 / calloc）
  ffi: ^2.1.0
  # 解压自动更新下载下来的 zip
  archive: ^3.6.1
  # 校验下载包的 SHA-256，确保和发布端逐字节一致
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
